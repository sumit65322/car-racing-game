name: Build Car Racing APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download game
        uses: actions/checkout@v4

      - name: Prepare game
        run: |
          cp new_car_racing_main.py main.py
          cat > buildozer.spec <<'EOF'
          [app]
          title = Car Racing Game
          package.name = carracinggame
          package.domain = org.sumit
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,wav,mp3,ttf,ogg
          requirements = python3,pygame
          orientation = landscape
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Install Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-racing-game-apk
          path: bin/*.apk
