name: Build Car Racing APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "buildozer.spec"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install buildozer cython

      - name: Create Buildozer spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          title = Car Racing Game
          package.name = carracinggame
          package.domain = org.sumit

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,wav,mp3,ogg

          version = 1.0.0

          requirements = python3,pygame

          orientation = landscape
          fullscreen = 0

          android.api = 35
          android.minapi = 24
      
  
          android.archs = arm64-v8a

          [buildozer]

          log_level = 2
          warn_on_root = 1
          EOF

      - name: Check game file
        run: |
          echo "Files in project:"
          find . -maxdepth 2 -type f
          echo "Checking main.py..."
          test -f main.py

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Car-Racing-APK
          path: bin/*.apk
          if-no-files-found: error
